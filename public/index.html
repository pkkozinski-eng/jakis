<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#37003c" />
  <title>Typer Premier League 2026/27</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
</head>
<body>
  <!-- Ekran logowania / dolaczania -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">⚽</div>
      <h1>Typer Premier League</h1>
      <p class="auth-sub">Sezon 2026/27 · typuj dokladne wyniki</p>

      <div class="tabs">
        <button class="tab-btn active" data-authtab="login">Logowanie</button>
        <button class="tab-btn" data-authtab="join">Dolacz do gry</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Nick <input name="nick" autocomplete="username" placeholder="Twoj nick" /></label>
        <label>PIN <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4-8 cyfr" /></label>
        <button type="submit" class="btn-primary">Zaloguj sie</button>
      </form>

      <form id="join-form" class="auth-form hidden">
        <div id="invite-note" class="invite-note hidden"></div>
        <label>Nick <input name="nick" placeholder="Wybierz nick (2-24 znaki)" /></label>
        <label>PIN <input name="pin" type="password" inputmode="numeric" placeholder="Ustaw PIN (4-8 cyfr)" /></label>
        <label>Kod zaproszenia <input name="invite" placeholder="Token z linku" /></label>
        <button type="submit" class="btn-primary">Dolacz</button>
        <p class="hint">Potrzebujesz linku z zaproszeniem od administratora ligi.</p>
      </form>

      <div id="auth-error" class="auth-error hidden"></div>
    </div>
  </div>

  <!-- Aplikacja glowna -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">⚽ <span>Typer PL 26/27</span></div>
      <div class="user-box">
        <span id="user-nick" class="user-nick"></span>
        <button id="logout-btn" class="btn-ghost" title="Wyloguj">Wyloguj</button>
      </div>
    </header>

    <nav class="tabbar" id="tabbar">
      <button class="navbtn active" data-view="matches"><span>⚽</span>Kolejka</button>
      <button class="navbtn" data-view="round-table"><span>📊</span>Tabela</button>
      <button class="navbtn" data-view="standings"><span>🏆</span>Klasyfikacja</button>
      <button class="navbtn" data-view="schedule"><span>📅</span>Terminarz</button>
      <button class="navbtn admin-only hidden" data-view="admin"><span>⚙️</span>Panel</button>
    </nav>

    <main id="main" class="main"></main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
